[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/portfoliopilot"]

[project]
name = "portfoliopilot-ai"
version = "0.1.0"
description = "Auditable five-agent investment research and paper-trading system"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "langchain>=1.1,<2",
    "langchain-openai>=1,<2",
    "langgraph>=1,<2",
    "langgraph-checkpoint-sqlite>=3,<4",
    "numpy>=2,<3",
    "openai>=1.54,<3",
    "pydantic>=2.9,<3",
    "scikit-learn>=1.6,<2",
    "uvicorn>=0.30,<1",
    "yfinance>=0.2.54,<1",
]

[project.optional-dependencies]
dev = ["pytest>=9.0.3,<10", "httpx>=0.27,<1", "ruff>=0.6,<1"]
kronos = [
    "einops>=0.8,<1",
    "huggingface-hub>=0.33,<2",
    "pandas>=2,<3",
    "safetensors>=0.6,<1",
    "torch>=2,<3",
    "tqdm>=4.67,<5",
]

[project.scripts]
portfoliopilot-backtest = "portfoliopilot.backtest_cli:main"
portfoliopilot-backup = "portfoliopilot.backup:main"
portfoliopilot-compare = "portfoliopilot.strategy_compare:main"
portfoliopilot-universe-download = "portfoliopilot.universe_download:main"
portfoliopilot-current-download = "portfoliopilot.current_universe_download:main"
portfoliopilot-current-backtest = "portfoliopilot.current_universe_backtest:main"
portfoliopilot-pit-download = "portfoliopilot.point_in_time_download:main"
portfoliopilot-yahoo-download = "portfoliopilot.yahoo_download:main"
portfoliopilot-council-backtest = "portfoliopilot.council_backtest:main"
portfoliopilot-historical-council-backtest = "portfoliopilot.historical_council_backtest:main"
portfoliopilot-reliability-compare = "portfoliopilot.reliability_compare:main"
portfoliopilot-robust-research = "portfoliopilot.robust_research:main"
portfoliopilot-portfolio-experiments = "portfoliopilot.portfolio_experiments:main"
portfoliopilot-core-satellite-backtest = "portfoliopilot.core_satellite_backtest:main"
portfoliopilot-paper-decision = "portfoliopilot.paper_decision_cli:main"
portfoliopilot-paper-snapshot = "portfoliopilot.paper_snapshot_cli:main"
portfoliopilot-kronos-llm-allocation = "portfoliopilot.kronos_llm_allocation_backtest:main"
stockwise-live-paper = "portfoliopilot.live_service:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["FURB157", "UP017"]
